queries:
  - id: 38
    label: Curator notes by path_id
    sql: >
      SELECT DISTINCT source_id, term_id AS path_id, note
      FROM feature_curator_notes
      WHERE %CONDITIONS%
    parameters:
    - id: path_id
      column: term_id
      label: Neuron population or cell precision
      type: string
      multiple: true
    - id: source_id
      column: source_id
      label: Knowledge source
      type: string
      multiple: true
      default_msg: the latest source is used
      default_sql: >
        select source_id from knowledge_sources where source_id like 'sckan%'
        order by source_id desc limit 1
    order: ''
    results:
    - key: source_id
      label: Knowledge source
      type: string
    - key: path_id
      label: Neuron population or cell precision
      type: string
    - key: note
      label: Curator note
      type: string
