queries:
  - id: 34
    label: Descriptive attributes of a cell precision with the given cell_id or descriptive phenotype or feature_id
    sql: >
      WITH
        dummy_cells (term_id, type_id, feature_id) AS (
          VALUES ('', '', '')
        ),
        sckan AS (
          SELECT source_id, sckan_id FROM knowledge_sources
            WHERE %CONDITION_3%
        )

        SELECT fda.source_id,
          fda.term_id AS cell_id,
          ft2.label AS cell_label,
          fda.type_id,
          fda.combination_id,
          fda.feature_id,
          ft.label AS feature_label
        FROM feature_desc_attributes fda
        JOIN feature_terms ft ON fda.source_id = ft.source_id AND fda.feature_id = ft.term_id
        JOIN feature_terms ft2 ON fda.source_id = ft2.source_id AND fda.term_id = ft2.term_id
        JOIN path_properties pp ON fda.source_id = pp.source_id AND fda.term_id = pp.path_id
        WHERE fda.source_id = (SELECT sckan_id FROM sckan)
          AND pp.type_id = 'NeuronPrecision'
          AND
        (
          %CONDITION_0%
          OR EXISTS (SELECT 1 FROM dummy_cells fda WHERE %CONDITION_0%)
        )
          AND
        (
          %CONDITION_1%
          OR EXISTS (SELECT 1 FROM dummy_cells fda WHERE %CONDITION_1%)
        )
          AND
        (
          %CONDITION_2%
          OR EXISTS (SELECT 1 FROM dummy_cells fda WHERE %CONDITION_2%)
        )
    parameters:
    - id: cell_id
      column: fda.term_id
      label: Anatomical terms for locations
      type: string
      multiple: true
      condition: CONDITION_0
      default_msg: An empty string is used for the cell_id and this will include all cell_id.
      default_sql: >
        select ''
    - id: type_id
      column: fda.type_id
      label: Descriptive phenotype type id
      type: string
      multiple: true
      condition: CONDITION_1
      default_msg: An empty string is used for the type_id and this will include all type_id.
      default_sql: >
        select ''
    - id: feature_id
      column: fda.feature_id
      label: Feature ID regarding gene or chemical compound
      type: string
      multiple: true
      condition: CONDITION_2
      default_msg: An empty string is used for the feature_id and this will include all feature_id.
      default_sql: >
        select ''
    - id: source_id
      column: source_id
      label: Knowledge source
      type: string
      condition: CONDITION_3
      default_msg: the latest source is used
      default_sql: >
        select source_id from knowledge_sources where source_id like 'sckan%'
        order by source_id desc limit 1
    order: ''
    results:
    - key: source_id
      label: Knowledge source
      type: string
    - key: cell_id
      label: Cell precision ID
      type: string
    - key: cell_label
      label: Cell precision label
      type: string
    - key: type_id
      label: Phenotype ID
      type: string
    - key: combination_id
      label: Combination value ID
      type: string
    - key: feature_id
      label: Feature value ID
      type: string
    - key: feature_label
      label: Feature value label
      type: string
