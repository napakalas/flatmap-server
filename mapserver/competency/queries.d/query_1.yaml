queries:
  - id: 1
    label: Neuron populations associated with a location
    sql: SELECT DISTINCT pnf.path_id, pnf.source_id FROM path_node_features pnf
          JOIN path_properties pp ON pnf.source_id=pp.source_id AND pnf.path_id = pp.path_id
          WHERE %CONDITIONS%
            AND (pp.type_id!='NeuronPrecision' OR pp.type_id IS NULL)
    parameters:
    - id: feature_id
      column: pnf.feature_id
      label: Anatomical terms for locations
      type: string
      multiple: true
    - id: source_id
      column: pnf.source_id
      label: Knowledge source
      type: string
      default_msg: the latest source is used
      default_sql: >
        select source_id from knowledge_sources where source_id like 'sckan%'
        order by source_id desc limit 1
    order: ''
    results:
    - key: source_id
      label: Knowledge source
      type: string
    - key: path_id
      label: Neuron population
      type: string
