queries:
  - id: 33
    label: Properties of a cell precision with the given cell_id
    sql: >
      WITH
      dummy_cells (term_id) AS (
        VALUES ('')
      ),
      sckan AS (
        SELECT source_id, sckan_id FROM knowledge_sources
        WHERE %CONDITION_1%
      )

      SELECT ft.source_id,
        ft.term_id AS cell_id,
        ft.label AS cell_label,
        ft.description AS long_label,
        pp.biological_sex,
        pp.alert,
        COALESCE(tx.taxon_ids, '{}') AS taxon_id,
        COALESCE(sub.cell_ids, '{}') AS subclass_id,
        COALESCE(sup.cell_ids, '{}') AS superclass_id,
        COALESCE(mt.cell_ids, '{}') AS maps_to_id,
        COALESCE(cn.notes, '{}') AS curator_note,
        COALESCE(dc.dataset_ids, '{}') AS dataset_id,
        COALESCE(ph.phenotypes, '{}') AS phenotype,
        COALESCE(ev.evidence_ids, '{}') AS reference
      FROM path_properties pp
      JOIN feature_terms ft ON pp.source_id = ft.source_id AND pp.path_id = ft.term_id AND pp.type_id = 'NeuronPrecision'
      LEFT JOIN LATERAL (
        SELECT ARRAY_AGG(DISTINCT pt.taxon_id ORDER BY pt.taxon_id) AS taxon_ids
        FROM path_taxons pt
        WHERE pt.source_id = ft.source_id AND pt.path_id = ft.term_id
      ) tx ON true
      LEFT JOIN LATERAL (
        SELECT ARRAY_AGG(DISTINCT fr.feature_0 ORDER BY fr.feature_0) AS cell_ids
        FROM feature_relationship fr
        WHERE fr.source_id = ft.source_id AND fr.feature_1 = ft.term_id AND fr.relationship = 'subclass-of'
      ) sub ON true
      LEFT JOIN LATERAL (
        SELECT ARRAY_AGG(DISTINCT fr.feature_1 ORDER BY fr.feature_1) AS cell_ids
        FROM feature_relationship fr
        WHERE fr.source_id = ft.source_id AND fr.feature_0 = ft.term_id AND fr.relationship = 'subclass-of'
      ) sup ON true
      LEFT JOIN LATERAL (
        SELECT ARRAY_AGG(DISTINCT fr.feature_1 ORDER BY fr.feature_1) AS cell_ids
        FROM feature_relationship fr
        WHERE fr.source_id = ft.source_id AND fr.feature_0 = ft.term_id AND fr.relationship = 'maps-to'
      ) mt ON true
      LEFT JOIN LATERAL (
        SELECT ARRAY_AGG(DISTINCT fc.note ORDER BY fc.note) AS notes
        FROM feature_curator_notes fc
        WHERE fc.source_id = ft.source_id AND fc.term_id = ft.term_id
      ) cn ON true
      LEFT JOIN LATERAL (
        SELECT ARRAY_AGG(DISTINCT fd.evidence_id ORDER BY fd.evidence_id) AS dataset_ids
        FROM feature_data_citations fd
        WHERE fd.source_id = ft.source_id AND fd.term_id = ft.term_id
      ) dc ON true
      LEFT JOIN LATERAL (
        SELECT ARRAY_AGG(DISTINCT pph.phenotype ORDER BY pph.phenotype) AS phenotypes
        FROM path_phenotypes pph
        WHERE pph.source_id = ft.source_id AND pph.path_id = ft.term_id
      ) ph ON true
      LEFT JOIN LATERAL (
        SELECT ARRAY_AGG(DISTINCT fe.evidence_id ORDER BY fe.evidence_id) AS evidence_ids
        FROM feature_evidence fe
        WHERE fe.source_id = ft.source_id AND fe.term_id = ft.term_id
      ) ev ON true
      WHERE ft.source_id = (SELECT sckan_id FROM sckan)
      AND
      (
        %CONDITION_0%
        OR EXISTS (SELECT 1 FROM dummy_cells as ft WHERE %CONDITION_0%)
      )
    parameters:
    - id: cell_id
      column: ft.term_id
      label: Cell precision ID
      type: string
      multiple: true
      condition: CONDITION_0
      default_msg: An empty string is used for the cell_id and this will include all cell_id.
      default_sql: >
        select ''
    - id: source_id
      column: source_id
      label: Knowledge source
      type: string
      condition: CONDITION_1
      default_msg: the latest source is used
      default_sql: >
        select source_id from knowledge_sources where source_id like 'sckan%'
        order by source_id desc limit 1
    order: ''
    results:
    - key: source_id
      label: Knowledge source
      type: string
    - key: cell_id
      label: Cell precision ID
      type: string
    - key: cell_label
      label: Cell precision label
      type: string
    - key: long_label
      label: Cell precision long label
      type: string
    - key: biological_sex
      label: Biological sex
      type: string
    - key: alert
      label: Alert
      type: string
    - key: taxon_id
      label: Species taxon terms (list)
      type: array
    - key: subclass_id
      label: Direct subclasses of the cell precision (list)
      type: array
    - key: superclass_id
      label: Direct superclasses of the cell precision (list)
      type: array
    - key: maps_to_id
      label: Cell precisions this cell precision maps to (list)
      type: array
    - key: curator_note
      label: Curator notes (list)
      type: array
    - key: dataset_id
      label: Data citations, i.e. datasets supporting the cell precision (list)
      type: array
    - key: phenotype
      label: Phenotypes of the cell precision (list)
      type: array
    - key: reference
      label: References, i.e. evidence supporting the cell precision (list)
      type: array
