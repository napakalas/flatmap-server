      - name: extras
        in: query
        schema:
          type: string
          description: Optional extra entries to include in the returned index, separated
            by `;`. Valid values are `mapAnnotations`, `mapLayers`, `mapMetadata`,
            `mapPathways`, and `mapStyle`.
          default: ''
          examples:
          - mapMetadata;mapStyle
        description: Optional extra entries to include in the returned index, separated
