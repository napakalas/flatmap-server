            application/json:
              schema:
                type: object
      deprecated: false
    post:
      summary: AnnotatorAddAnnotation
      description: Create an annotation. Requires `key` and `session` obtained from
        [GET /annotator/authenticate](#get-/annotator/authenticate), and an authenticated
        user with update permission.
      operationId: AnnotatorAnnotationAnnotatorAddAnnotation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationUpdateRequest'
        required: true
      responses:
        '201':
          description: Document created, URL follows
          headers: {}
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                - {}
        '400':
