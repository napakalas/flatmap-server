components:
  schemas:
    AnnotationUpdateRequest:
      properties:
        key:
          type: string
        session:
          type: string
        data:
          type: object
      type: object
      required:
      - data
      - key
      - session
      title: AnnotationUpdateRequest
      description: The authenticated session (`key`, `session`) and annotation data
        to create or update.
    ColumnDefinition:
      properties:
        name:
          type: string
        type:
          type: string
        primary_key:
          type: boolean
        nullable:
          type: boolean
      type: object
      required:
      - name
      - nullable
      - primary_key
      - type
      title: ColumnDefinition
    DatabaseSchemaResponse:
      properties:
        tables:
          items:
            $ref: '#/components/schemas/TableDefinition'
          type: array
      type: object
      required:
      - tables
      title: DatabaseSchemaResponse
    ForeignKeyDefinition:
      properties:
        column:
          type: string
        to_table:
          type: string
        to_column:
          type: string
      type: object
      required:
      - column
      - to_column
      - to_table
      title: ForeignKeyDefinition
    KnowledgeSourcesResponse:
      properties:
        sources:
          items:
            type: string
          type: array
      type: object
      required:
      - sources
      title: KnowledgeSourcesResponse
    MakerData:
      properties:
        source:
          type: string
        manifest:
          type: string
        commit:
          oneOf:
          - type: string
          - type: 'null'
        force:
          oneOf:
          - type: boolean
          - type: 'null'
      type: object
      required:
      - manifest
      - source
      title: MakerData
      description: The manifest source and options for generating a flatmap.
      example:
        source: https://github.com/AnatomicMaps/human-flatmap
        manifest: female.manifest.json
        commit: main
        force: false
    MakerLogResponse:
      properties:
        status:
          type: string
        id:
          oneOf:
          - type: integer
          - type: 'null'
        pid:
          oneOf:
          - type: integer
          - type: 'null'
        log:
          type: string
        stamp:
          oneOf:
          - type: string
          - type: 'null'
      type: object
      required:
      - id
      - log
      - pid
      - status
      title: MakerLogResponse
    MakerResponse:
      properties:
        status:
          type: string
        id:
          oneOf:
          - type: integer
          - type: 'null'
        pid:
          oneOf:
          - type: integer
          - type: 'null'
        source:
          type: string
        commit:
          oneOf:
          - type: string
          - type: 'null'
      type: object
      required:
      - id
      - pid
      - source
      - status
      title: MakerResponse
    MakerStatus:
      properties:
        status:
          type: string
        id:
          oneOf:
          - type: integer
          - type: 'null'
        pid:
          oneOf:
          - type: integer
          - type: 'null'
      type: object
      required:
      - id
      - pid
      - status
      title: MakerStatus
    ParameterChoiceDict:
      properties:
        label:
          type: string
        value:
          type: string
      type: object
      required:
      - label
      - value
      title: ParameterChoiceDict
    ParameterDefinitionDict:
      properties:
        column:
          type: string
        label:
          type: string
        type:
          type: string
        choices:
          items:
            $ref: '#/components/schemas/ParameterChoiceDict'
          type: array
        multiple:
          type: boolean
        default:
          type: string
      type: object
      required:
      - column
      - label
      title: ParameterDefinitionDict
    QueryData:
      properties:
        sql:
          type: string
          description: A read-only SQLite SQL statement to execute against the knowledge
            store.
        params:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Values bound to positional `?` placeholders in `sql`, in order.
      type: object
      required:
      - sql
      title: QueryData
      description: SQL statement and positional parameter values for a knowledge-store
        query.
      example:
        sql: SELECT value FROM metadata WHERE name = ?
        params:
        - schema_version
    QueryDefinitionDict:
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        parameters:
          items:
